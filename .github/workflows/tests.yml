name: API and DB checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Run API tests with PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      COMPOSE_PROJECT_NAME: kanboard-ci
      COMPOSE_FILE: compose.yaml:compose.ci.yaml

      DB_HOST: "127.0.0.1"
      DB_PORT: "5433"
      DB_NAME: kanboard
      DB_USER: kanboard
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

      API_URL: http://127.0.0.1:8081/jsonrpc.php
      API_USERNAME: jsonrpc
      API_TOKEN: ${{ secrets.CI_API_TOKEN }}
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
        
      - name: Show tool version
        run: |
          python --version
          python -m pip --version
          docker compose version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check required configuration
        run: |
          python - <<'PY'
          import os

          required = ("DB_PASSWORD", "API_TOKEN")
          missing = [name for name in required if not os.environ.get(name)]

          if missing:
              raise SystemExit(
                  "Missing required configuration: " + ", ".join(missing)
              )

          print("Required configuration is present")
          PY

      - name: Set up Java for Allure
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        env:
          ALLURE_VERSION: "2.35.1"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            --output "$RUNNER_TEMP/allure.tgz"

          tar -xzf "$RUNNER_TEMP/allure.tgz" -C "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin/allure" --version

      - name: Start application
        run: docker compose up -d --wait --wait-timeout 120

      - name: Wait for API readiness
        run: python scripts/wait_for_api.py

      - name: Run tests
        id: tests
        run: |
          python -m pytest -v \
          --alluredir=allure-results \
          --clean-alluredir

      - name: Upload Allure results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Generate Allure report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          if ! find allure-results -type f -name '*-result.json' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::No Allure test results were produced. Check the pytest step."
            exit 1
          fi

          allure generate allure-results \
            --output allure-report \
            --clean

      - name: Upload Allure report
        if: ${{ !cancelled() && hashFiles('allure-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-report/
          retention-days: 14
          if-no-files-found: error

      - name: Show service logs on failure
        if: ${{ failure() }}
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100

      - name: Stop application
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
