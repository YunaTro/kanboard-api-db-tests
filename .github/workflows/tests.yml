name: API and DB checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Run API tests with PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      pages_ready: ${{ steps.pages_artifact.outcome == 'success' }}

    env:
      COMPOSE_PROJECT_NAME: kanboard-ci
      COMPOSE_FILE: compose.yaml:compose.ci.yaml

      DB_NAME: kanboard
      DB_USER: kanboard
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

      API_TOKEN: ${{ secrets.CI_API_TOKEN }}
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Check required configuration
        shell: bash
        run: |
          if [[ -z "$DB_PASSWORD" || -z "$API_TOKEN" ]]; then
            echo "::error::CI_DB_PASSWORD and CI_API_TOKEN must be configured"
            exit 1
          fi

          echo "Required configuration is present"

      - name: Build test image
        run: docker compose build tests

      - name: Set up Java for Allure
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        env:
          ALLURE_VERSION: "2.35.1"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            --output "$RUNNER_TEMP/allure.tgz"

          tar -xzf "$RUNNER_TEMP/allure.tgz" -C "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin/allure" --version

      - name: Start application
        run: docker compose up -d --wait --wait-timeout 120 postgres kanboard

      - name: Run tests in container
        run: docker compose run --rm -T --no-deps tests

      - name: Upload Allure results
        if: ${{ !cancelled() && hashFiles('allure-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Generate Allure report
        if: ${{ !cancelled() && hashFiles('allure-results/*-result.json') != '' }}
        run: |
          allure generate allure-results \
            --output allure-report \
            --clean

      - name: Upload Allure report
        if: ${{ !cancelled() && hashFiles('allure-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-report/
          retention-days: 14
          if-no-files-found: error

      - name: Upload report for GitHub Pages
        id: pages_artifact
        if: >-
          ${{
            !cancelled() &&
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            hashFiles('allure-report/index.html') != ''
          }}
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-report/

      - name: Show service logs on failure
        if: ${{ failure() }}
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100 postgres kanboard

      - name: Stop application
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Publish Allure report
    needs: tests

    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.tests.outputs.pages_ready == 'true'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
