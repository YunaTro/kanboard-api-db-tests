name: API and DB checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Run API tests with PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      COMPOSE_PROJECT_NAME: kanboard-ci
      COMPOSE_FILE: compose.yaml:compose.ci.yaml

      DB_HOST: "127.0.0.1"
      DB_PORT: "5433"
      DB_NAME: kanboard
      DB_USER: kanboard
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

      API_URL: http://127.0.0.1:8081/jsonrpc.php
      API_USERNAME: jsonrpc
      API_TOKEN: ${{ secrets.CI_API_TOKEN }}
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
        
      - name: Show tool version
        run: |
          python --version
          python -m pip --version
          docker compose version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check required configuration
        run: |
          python - <<'PY'
          import os

          required = ("DB_PASSWORD", "API_TOKEN")
          missing = [name for name in required if not os.environ.get(name)]

          if missing:
              raise SystemExit(
                  "Missing required configuration: " + ", ".join(missing)
              )

          print("Required configuration is present")
          PY

      - name: Start application
        run: docker compose up -d --wait --wait-timeout 120

      - name: Wait for API readiness
        run: python scripts/wait_for_api.py

      - name: Run tests
        run: python -m pytest -v          

      - name: Show service logs on failure
        if: ${{ failure() }}
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100

      - name: Stop application
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
