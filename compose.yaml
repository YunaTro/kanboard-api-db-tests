name: kanboard-api-db-tests

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

  kanboard:
    image: kanboard/kanboard:v1.2.45
    environment:
      DB_DRIVER: postgres
      DB_HOSTNAME: postgres
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    volumes:
      - kanboard_data:/var/www/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  kanboard_data: